# szsdlc project configuration.
#
# This file is deep-merged over the built-in defaults, so everything below is
# optional and an empty file is already a valid project. Adjust one flag:
#
#   entity_types: {spike: {persistent: true}}
#
# drop a type you do not want (`entity_types: {spike: null}`), or replace a
# whole section outright (`entity_types: {_replace: true, ...}`).

project:
  name: szcdf

# Local override: enable a terminal `rejected` status for decisions until the
# installed szsdlc ships it as a default. Replaces the decision workflow so an
# ADR can be rejected from proposed or accepted. Remove once the tool default
# provides `rejected`.
entity_types:
  decision:
    workflow:
      _replace: true
      initial: proposed
      states:
        proposed:
          to: [accepted, superseded, rejected]
        accepted:
          to: [superseded, rejected]
        superseded:
          terminal: true
        rejected:
          terminal: true
